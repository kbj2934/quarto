<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>콰르토 배우기 - 보드게임 튜토리얼</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  background:#f6efe1;color:#3b2b18;overflow:hidden;-webkit-text-size-adjust:100%;
}
button{font-family:inherit}

/* ---------- 레이아웃 : FHD PC 가로 기준 ---------- */
#app{
  height:100%;display:grid;gap:10px;padding:10px;
  grid-template-columns:minmax(0,1fr) 400px;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "board panel" "tray panel";
}
#head{grid-area:head;min-width:0}
#boardWrap{grid-area:board;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#trayWrap{grid-area:tray;min-width:0}
#panel{grid-area:panel;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden}

/* 태블릿 16:10 / 4:3 */
@media (max-width:1440px){
  #app{grid-template-columns:minmax(0,1fr) 336px;gap:8px;padding:8px}
}
@media (max-width:1120px){
  #app{grid-template-columns:minmax(0,1fr) 300px}
}
/* 모바일 세로 (9:20 등) : 1열 스크롤 */
@media (max-width:820px),(max-aspect-ratio:4/5){
  body{overflow:auto}
  #app{height:auto;min-height:100%;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto auto auto;
    grid-template-areas:"head" "board" "tray" "panel";}
  #boardWrap{height:min(94vw,58vh)}
  #panel{overflow:visible}
}

/* ---------- 헤더 ---------- */
#head{background:#fff;border:2px solid #dfcdaa;border-radius:14px;padding:8px 12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#logo{font-size:20px;font-weight:800;color:#8a5a2b;letter-spacing:-.5px;white-space:nowrap}
#logo small{display:block;font-size:11px;font-weight:600;color:#a8906c;letter-spacing:0}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:2px solid #dfcdaa;background:#faf4e8;color:#7b6647;border-radius:9px;
  padding:5px 9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip:hover{background:#fff0d4}
.chip.on{background:#1c7ed6;border-color:#1567b3;color:#fff}
.chip.done{border-color:#2f9e44;color:#2f9e44;background:#ebfbee}
.chip.on.done{background:#2f9e44;border-color:#268a3b;color:#fff}
#headBtns{display:flex;gap:6px}
.mini{border:2px solid #dfcdaa;background:#fff;border-radius:9px;padding:6px 10px;
  font-size:12.5px;font-weight:700;color:#7b6647;cursor:pointer}
.mini.on{background:#fcc419;border-color:#e0a800;color:#5c4300}

/* ---------- 말판 ---------- */
.board{
  width:var(--bs,480px);height:var(--bs,480px);
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  gap:calc(var(--bs,480px) * .018);
  background:#9a6633;border:calc(var(--bs,480px) * .022) solid #6d4520;
  border-radius:calc(var(--bs,480px) * .035);
  padding:calc(var(--bs,480px) * .022);
}
.cell{
  background:#ecdcbd;border:2px solid #cba97c;border-radius:calc(var(--bs,480px) * .02);
  padding:0;position:relative;display:flex;align-items:center;justify-content:center;
  cursor:default;overflow:visible;
}
.cell.click{cursor:pointer}
.cell.click:hover{background:#f7ebd2}
.cell svg{width:100%;height:100%;display:block}
.cell.win{background:#ffe066;border-color:#f08c00;box-shadow:0 0 0 3px #ffd43b inset}
.cell.hint{border-color:#2f9e44;background:#e7f8ea;animation:blip 1.1s infinite}
.cell.danger{border-color:#e03131;background:#ffecec}
.cell.dimc{opacity:.30}
.cell .num{position:absolute;top:2px;left:4px;font-size:11px;font-weight:800;color:#b39a72}
.cell .rowtag{position:absolute;left:-2px;top:50%;transform:translate(-100%,-50%);
  font-size:15px;font-weight:900;color:#fff;background:#8a5a2b;border-radius:6px;padding:2px 7px}
@keyframes blip{0%,100%{box-shadow:0 0 0 0 rgba(47,158,68,.55) inset}50%{box-shadow:0 0 0 6px rgba(47,158,68,.35) inset}}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.drop{animation:dp .22s ease-out}
@keyframes dp{0%{transform:translateY(-16px) scale(.92);opacity:.4}100%{transform:none;opacity:1}}

/* ---------- 말 보관함 ---------- */
#trayWrap{background:#fff;border:2px solid #dfcdaa;border-radius:14px;padding:8px 10px}
.trayHead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.trayHead b{font-size:14px;color:#8a5a2b}
.trayHead span{font-size:12.5px;color:#9c8664;font-weight:600}
.tray{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-start}
.slot{
  width:clamp(40px,5.1vw,74px);aspect-ratio:1;flex:0 0 auto;
  background:#faf3e6;border:2px solid #e0d0b1;border-radius:9px;padding:1px;
  display:flex;align-items:center;justify-content:center;position:relative;cursor:default;
}
.slot svg{width:100%;height:100%;display:block}
.slot.click{cursor:pointer}
.slot.click:hover{background:#fff0d4;border-color:#c9a374}
.slot.empty{background:#f1ebe0;border-style:dashed;opacity:.5}
.slot.sel{border-color:#1c7ed6;background:#e7f2fd;box-shadow:0 0 0 3px #a5d0f7}
.slot.bad::after{content:"\2715";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,3vw,40px);font-weight:900;color:rgba(224,49,49,.85)}
.slot.bad{border-color:#e03131;background:#ffecec}
.slot.ok{border-color:#2f9e44;background:#ebfbee}
.slot.dim{opacity:.28}

/* ---------- 오른쪽 패널 ---------- */
.card{background:#fff;border:2px solid #dfcdaa;border-radius:14px;padding:12px;margin-bottom:8px}
.card h2{margin:0 0 6px;font-size:19px;color:#8a5a2b;letter-spacing:-.5px}
.card h3{margin:10px 0 5px;font-size:14.5px;color:#8a5a2b}
.card p{margin:6px 0;font-size:14.5px;line-height:1.6}
.card ul{margin:6px 0;padding-left:20px;font-size:14.5px;line-height:1.65}
.card li{margin:3px 0}
.kw{background:#fff3bf;border-radius:5px;padding:1px 5px;font-weight:800;color:#7a5b00}
.kwg{background:#ebfbee;border-radius:5px;padding:1px 5px;font-weight:800;color:#25753a}
.kwr{background:#ffecec;border-radius:5px;padding:1px 5px;font-weight:800;color:#c02525}
.big{background:#fff9e0;border:2px dashed #f0c94a;border-radius:12px;padding:10px;
  font-size:15.5px;font-weight:700;line-height:1.55;color:#6b4f00}
.say{background:#e7f2fd;border:2px solid #a5d0f7;border-radius:12px;padding:10px;
  font-size:15px;font-weight:700;line-height:1.55;color:#12558f;min-height:22px}
.say.good{background:#ebfbee;border-color:#8ce09f;color:#1c7031}
.say.bad{background:#ffecec;border-color:#ffa8a8;color:#b32222}
.btn{display:inline-block;border:none;border-radius:12px;padding:11px 16px;font-size:15.5px;
  font-weight:800;cursor:pointer;background:#1c7ed6;color:#fff;border-bottom:4px solid #14588f;margin:4px 4px 0 0}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.g{background:#2f9e44;border-bottom-color:#1f6e2f}
.btn.y{background:#fcc419;color:#5c4300;border-bottom-color:#c99a00}
.btn.w{background:#fff;color:#7b6647;border:2px solid #dfcdaa;border-bottom-width:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnRow{display:flex;flex-wrap:wrap;gap:0}
.attrBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ab{border:2px solid #dfcdaa;background:#faf4e8;border-radius:11px;padding:9px 6px;cursor:pointer;
  font-size:13.5px;font-weight:800;color:#7b6647;line-height:1.35}
.ab:hover{background:#fff0d4}
.ab.on{background:#1c7ed6;border-color:#1567b3;color:#fff}
.ab.seen{border-color:#2f9e44}
.quizBtns{display:flex;gap:6px}
.qb{flex:1;border:2px solid #dfcdaa;background:#faf4e8;border-radius:11px;padding:12px 4px;
  font-size:18px;font-weight:900;color:#7b6647;cursor:pointer}
.qb:hover{background:#fff0d4}
.mission{display:flex;align-items:center;gap:8px;background:#f6efe1;border-radius:10px;padding:8px 10px;
  font-size:13.5px;font-weight:800;color:#7b6647;margin-top:8px}
.mission .dot{width:18px;height:18px;border-radius:50%;background:#dfcdaa;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.mission.done{background:#ebfbee;color:#1c7031}
.mission.done .dot{background:#2f9e44}
.handBox{display:flex;align-items:center;gap:10px;background:#f6efe1;border-radius:12px;padding:8px 10px}
.handBox .pv{width:62px;height:62px;flex:0 0 auto;background:#fff;border:2px solid #e0d0b1;border-radius:10px}
.handBox .pv svg{width:100%;height:100%;display:block}
.handBox .tx{font-size:13.5px;font-weight:700;line-height:1.45;color:#6b5330;min-width:0}
.handBox .tx b{display:block;font-size:15px;color:#8a5a2b}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-bottom:1px dashed #e6d8bd;padding:8px 0;font-size:14px;font-weight:700;color:#6b5330}
.seg{display:flex;gap:4px}
.seg button{border:2px solid #dfcdaa;background:#faf4e8;border-radius:9px;padding:6px 9px;
  font-size:12.5px;font-weight:800;color:#7b6647;cursor:pointer}
.seg button.on{background:#1c7ed6;border-color:#1567b3;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;color:#9c8664;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-140%);
  background:#3b2b18;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;font-weight:800;
  transition:transform .25s;z-index:50;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <div id="logo">콰르토 배우기<small>QUARTO 규칙 튜토리얼</small></div>
    <div class="chips" id="chips"></div>
    <div id="headBtns">
      <button class="mini" id="btnHint">도움말</button>
      <button class="mini" id="btnReset">처음부터</button>
    </div>
  </div>

  <div id="boardWrap"><div class="board" id="board"></div></div>

  <div id="trayWrap">
    <div class="trayHead"><b id="trayTitle">말 보관함</b><span id="traySub">아직 쓰지 않은 말들이에요.</span></div>
    <div class="tray" id="tray"></div>
  </div>

  <div id="panel"></div>
</div>
<div id="toast"></div>

<script>
"use strict";
/*==ENGINE==*/
/* 말 = 0~15 정수. 비트 1:어두운나무 / 2:네모 / 4:작은키 / 8:구멍 */
var ATTR=[
 {bit:1,name:"색깔",v0:"밝은 나무",v1:"어두운 나무"},
 {bit:2,name:"모양",v0:"동그라미",v1:"네모"},
 {bit:4,name:"키",v0:"큰 말",v1:"작은 말"},
 {bit:8,name:"윗면",v0:"꽉 찬 말",v1:"구멍 뚫린 말"}
];
var LN=[];
(function(){
  for(var r=0;r<4;r++)LN.push([r*4,r*4+1,r*4+2,r*4+3]);
  for(var c=0;c<4;c++)LN.push([c,c+4,c+8,c+12]);
  LN.push([0,5,10,15]);LN.push([3,6,9,12]);
})();
var SQ=[];
(function(){
  for(var r=0;r<3;r++)for(var c=0;c<3;c++){var i=r*4+c;SQ.push([i,i+1,i+4,i+5]);}
})();
function allLines(sq){return sq?LN.concat(SQ):LN;}
function commonBits(a,b,c,d){var A=a&b&c&d,O=(~(a|b|c|d))&15;return (A|O)&15;}
function winLines(bd,sq){
  var out=[],ls=allLines(sq),i,ln,a,b,c,d;
  for(i=0;i<ls.length;i++){
    ln=ls[i];a=bd[ln[0]];b=bd[ln[1]];c=bd[ln[2]];d=bd[ln[3]];
    if(a!=null&&b!=null&&c!=null&&d!=null&&commonBits(a,b,c,d))out.push(ln);
  }
  return out;
}
function winCells(bd,piece,sq){
  var out=[],i;
  if(piece==null)return out;
  for(i=0;i<16;i++){
    if(bd[i]!=null)continue;
    bd[i]=piece;
    if(winLines(bd,sq).length)out.push(i);
    bd[i]=null;
  }
  return out;
}
function emptyCells(bd){var o=[],i;for(i=0;i<16;i++)if(bd[i]==null)o.push(i);return o;}
function restPieces(bd,extra){
  var used={},i,o=[];
  for(i=0;i<16;i++)if(bd[i]!=null)used[bd[i]]=1;
  if(extra!=null)used[extra]=1;
  for(i=0;i<16;i++)if(!used[i])o.push(i);
  return o;
}
function safeGifts(bd,pool,sq){
  var o=[],i;
  for(i=0;i<pool.length;i++)if(winCells(bd,pool[i],sq).length===0)o.push(pool[i]);
  return o;
}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}

/* ---- 탐색 (어려움 난이도) ---- */
var MEMO={},NODES=0;
function keyOf(bd,piece){return bd.join(",")+"|"+piece;}
function depthFor(n){return n<=6?n:(n<=9?2:1);}
function solve(bd,piece,depth,sq){
  var es=emptyCells(bd),i,c,g,pool,best,v,k;
  if(es.length===0)return 0;
  for(i=0;i<es.length;i++){
    c=es[i];bd[c]=piece;
    v=winLines(bd,sq).length;bd[c]=null;
    if(v)return 1;
  }
  if(depth<=0||NODES>40000)return 0;
  k=keyOf(bd,piece)+"|"+depth;
  if(MEMO[k]!==undefined)return MEMO[k];
  NODES++;
  pool=restPieces(bd,piece);
  if(pool.length===0){MEMO[k]=0;return 0;}
  best=-1;
  for(i=0;i<es.length;i++){
    c=es[i];bd[c]=piece;
    var cellV=-1;
    for(var j=0;j<pool.length;j++){
      g=pool[j];
      var r=-solve(bd,g,depth-1,sq);
      if(r>cellV)cellV=r;
      if(cellV===1)break;
    }
    bd[c]=null;
    if(cellV>best)best=cellV;
    if(best===1)break;
  }
  MEMO[k]=best;
  return best;
}
function aiPlace(bd,piece,lv,sq){
  var es=emptyCells(bd),wc=winCells(bd,piece,sq),i,c;
  if(lv>0&&wc.length)return wc[0];
  if(lv===0)return rnd(es);
  if(lv===2&&es.length<=10){
    MEMO={};NODES=0;
    var pool0=restPieces(bd,piece),bestC=null,bv=-2;
    for(i=0;i<es.length;i++){
      c=es[i];bd[c]=piece;
      var v=-1;
      if(pool0.length===0)v=0;
      else{
        for(var j=0;j<pool0.length;j++){
          var r=-solve(bd,pool0[j],depthFor(emptyCells(bd).length),sq);
          if(r>v)v=r;
          if(v===1)break;
        }
      }
      bd[c]=null;
      if(v>bv){bv=v;bestC=c;}
      if(bv===1)break;
    }
    if(bestC!=null)return bestC;
  }
  var sc=[];
  for(i=0;i<es.length;i++){
    c=es[i];bd[c]=piece;
    var pool=restPieces(bd),s=safeGifts(bd,pool,sq).length;
    bd[c]=null;
    sc.push({c:c,s:s});
  }
  sc.sort(function(a,b){return b.s-a.s;});
  var top=sc.filter(function(x){return x.s===sc[0].s;});
  return rnd(top).c;
}
function aiGive(bd,lv,sq){
  var pool=restPieces(bd);
  if(!pool.length)return null;
  var safe=safeGifts(bd,pool,sq),cand=safe.length?safe:pool,i;
  if(lv===0)return rnd(pool);
  if(lv===2&&emptyCells(bd).length<=10){
    MEMO={};NODES=0;
    var best=null,bv=2;
    for(i=0;i<cand.length;i++){
      var r=solve(bd,cand[i],depthFor(emptyCells(bd).length),sq);
      if(r<bv){bv=r;best=cand[i];}
      if(bv===-1)break;
    }
    if(best!=null)return best;
  }
  return rnd(cand);
}
/*==/ENGINE==*/

/* ---------- 말 그리기 : 자기완결형 SVG (인스턴스마다 고유 ID) ---------- */
var WOOD={
  light:{lo:"#a9711f",mid:"#e9c288",hi:"#f8e0b4",top:"#f2d29d",edge:"#8d5c1a",
         bore:"#7d5215",floor:"#c99e58",grain:"rgba(120,78,20,.30)"},
  dark:{lo:"#2b1607",mid:"#7c4b22",hi:"#a06c3c",top:"#8b5830",edge:"#221104",
        bore:"#190c03",floor:"#543014",grain:"rgba(30,15,4,.40)"}
};
var PID=0;
function pieceSVG(p){
  var isDark=!!(p&1),isSq=!!(p&2),isShort=!!(p&4),isHollow=!!(p&8);
  var W=isDark?WOOD.dark:WOOD.light;
  var id="wg"+(++PID);
  var cx=50,baseY=86.5,h=isShort?33:57,topY=baseY-h,rx=isSq?25:26,ry=8.6;
  var s='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  s+='<defs><linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+(cx-rx)+'" y1="0" x2="'+(cx+rx)+'" y2="0">';
  if(isSq){
    s+='<stop offset="0" stop-color="'+W.lo+'"/><stop offset="0.10" stop-color="'+W.mid+'"/>'
     + '<stop offset="0.42" stop-color="'+W.hi+'"/><stop offset="0.72" stop-color="'+W.mid+'"/>'
     + '<stop offset="1" stop-color="'+W.lo+'"/>';
  }else{
    s+='<stop offset="0" stop-color="'+W.lo+'"/><stop offset="0.14" stop-color="'+W.mid+'"/>'
     + '<stop offset="0.36" stop-color="'+W.hi+'"/><stop offset="0.58" stop-color="'+W.mid+'"/>'
     + '<stop offset="0.84" stop-color="'+W.lo+'"/><stop offset="1" stop-color="'+W.edge+'"/>';
  }
  s+='</linearGradient></defs>';
  s+='<ellipse cx="'+cx+'" cy="'+(baseY+3.2)+'" rx="'+(rx+4)+'" ry="6" fill="#000000" opacity="0.17"/>';
  var body='url(#'+id+') '+W.mid;
  if(isSq){
    var ty=topY+ry, bh=baseY-ty;
    s+='<rect x="'+(cx-rx)+'" y="'+ty+'" width="'+(2*rx)+'" height="'+bh+'" rx="1.5" fill="'+body+'" stroke="'+W.edge+'" stroke-width="1.6"/>';
    s+='<rect x="'+(cx-rx)+'" y="'+(baseY-bh*0.28)+'" width="'+(2*rx)+'" height="'+(bh*0.28)+'" fill="'+W.lo+'" opacity="0.30"/>';
    for(var i=1;i<=3;i++){
      var gx=cx-rx+(2*rx)*(i/4);
      s+='<line x1="'+gx+'" y1="'+(ty+2)+'" x2="'+(gx+0.8)+'" y2="'+(baseY-2)+'" stroke="'+W.grain+'" stroke-width="1"/>';
    }
    s+='<polygon points="'+(cx-rx)+','+ty+' '+(cx+rx)+','+ty+' '+(cx+rx*0.88)+','+(topY-ry)+' '+(cx-rx*0.88)+','+(topY-ry)+'" fill="'+W.top+'" stroke="'+W.edge+'" stroke-width="1.6"/>';
  }else{
    s+='<ellipse cx="'+cx+'" cy="'+baseY+'" rx="'+rx+'" ry="'+ry+'" fill="'+W.lo+'" stroke="'+W.edge+'" stroke-width="1.6"/>';
    s+='<rect x="'+(cx-rx)+'" y="'+topY+'" width="'+(2*rx)+'" height="'+(baseY-topY)+'" fill="'+body+'"/>';
    for(var k=1;k<=3;k++){
      var gx2=cx-rx+(2*rx)*(k/4);
      s+='<line x1="'+gx2+'" y1="'+(topY+3)+'" x2="'+(gx2+0.7)+'" y2="'+(baseY+2)+'" stroke="'+W.grain+'" stroke-width="1"/>';
    }
    s+='<line x1="'+(cx-rx)+'" y1="'+topY+'" x2="'+(cx-rx)+'" y2="'+baseY+'" stroke="'+W.edge+'" stroke-width="1.6"/>';
    s+='<line x1="'+(cx+rx)+'" y1="'+topY+'" x2="'+(cx+rx)+'" y2="'+baseY+'" stroke="'+W.edge+'" stroke-width="1.6"/>';
    s+='<ellipse cx="'+cx+'" cy="'+topY+'" rx="'+rx+'" ry="'+ry+'" fill="'+W.top+'" stroke="'+W.edge+'" stroke-width="1.6"/>';
  }
  var brx=rx*0.50,bry=ry*0.50;
  if(isHollow){
    s+='<ellipse cx="'+cx+'" cy="'+(topY-0.3)+'" rx="'+brx+'" ry="'+bry+'" fill="'+W.bore+'"/>';
    s+='<ellipse cx="'+cx+'" cy="'+(topY+1.5)+'" rx="'+(brx*0.82)+'" ry="'+(bry*0.72)+'" fill="'+W.floor+'"/>';
    s+='<ellipse cx="'+cx+'" cy="'+(topY-0.3)+'" rx="'+brx+'" ry="'+bry+'" fill="none" stroke="'+W.edge+'" stroke-width="1.2"/>';
  }else{
    s+='<ellipse cx="'+(cx-5)+'" cy="'+(topY-1.6)+'" rx="'+(rx*0.46)+'" ry="'+(ry*0.40)+'" fill="#ffffff" opacity="0.16"/>';
  }
  s+='</svg>';
  return s;
}
function pieceName(p){
  return (p&1?"어두운":"밝은")+" / "+(p&2?"네모":"동그라미")+" / "+(p&4?"작은":"큰")+" / "+(p&8?"구멍":"꽉찬");
}
function bitLabel(bits,sample){
  var t=[],i;
  for(i=0;i<4;i++)if(bits&ATTR[i].bit)t.push((sample&ATTR[i].bit)?ATTR[i].v1:ATTR[i].v0);
  return t.join(" · ");
}

function renderBoard(){

function clickableCell(i){
  if(S.lock||S.over)return false;
  if(S.ch===1)return S.board[i]!=null;
  if(S.board[i]!=null)return false;
  if(S.ch===2)return true;
  if(S.ch===6)return true;

function renderTray(){
  var t=$("#tray"),h="",p,i;
  var list=S.trayList;
  if(S.trayMode==="none"){$("#trayWrap").style.display="none";return;}
  $("#trayWrap").style.display="";
  if(!list){
    list=[];
    for(p=0;p<16;p++)list.push(p);
  }
  var used={};
  for(i=0;i<16;i++)if(S.board[i]!=null)used[S.board[i]]=1;
  for(i=0;i<list.length;i++){
    p=list[i];
    if(used[p]){h+='<div class="slot empty"></div>';continue;}
    var cls="slot";
    if(S.selP===p||(S.hand===p&&(S.ch===5||S.ch===7)))cls+=" sel";
    if(S.okP.indexOf(p)>=0)cls+=" ok";

  else sub.textContent="아직 쓰지 않은 말들이에요. 눌러서 상대에게 주세요.";
}
function clickablePiece(p){
  if(S.lock||S.over)return false;
  if(S.ch===4)return D_CH4.cand.indexOf(p)>=0;
  if(S.ch===5||S.ch===7)return S.phase==="pick"&&(!S.vsAI||S.turn===0);

}

/* ---------- 챕터 진입 ---------- */
function clearVis(){
  S.hi=[];S.hiCell=[];S.hiLine=[];S.dim=[];S.okP=[];S.badP=[];S.selP=null;
  S.say="";S.sayType="";S.rowTags=false;S.cellNums=false;S.lock=false;S.over=false;
  S.pendingWin=false;S.hand=null;
}
function enter(ch){
  S.ch=ch;clearVis();S.selA=-1;S.missionDone=false;
  S.board=[];
  var i;for(i=0;i<16;i++)S.board.push(null);
  if(ch===1){
    for(i=0;i<16;i++)S.board[i]=i;
    S.trayMode="none";S.trayList=null;S.seen={};
  }else if(ch===2){
    S.board=D_CH2.board.slice();S.hand=D_CH2.piece;
    S.trayMode="list";S.trayList=[D_CH2.piece];S.selP=D_CH2.piece;S.cellNums=true;
  }else if(ch===3){
    S.quiz=0;loadQuiz();S.trayMode="none";
  }else if(ch===4){
    S.board=D_CH4.board.slice();S.trayMode="list";S.trayList=D_CH4.cand.slice();
  }else if(ch===5){
    S.trayMode="list";S.trayList=null;S.lv=1;S.sq=false;S.declare=false;S.vsAI=true;
    S.hints=true;$("#btnHint").classList.add("on");newGame();
  }else if(ch===6){
    S.board=D_CH6.board.slice();S.hand=D_CH6.piece;S.trayMode="list";S.trayList=[D_CH6.piece];
    S.selP=D_CH6.piece;S.cellNums=true;
  }else{
    S.trayMode="list";S.trayList=null;newGame();S.missionDone=true;
  }
  save();renderAll();
}
function loadQuiz(){
  var q=D_CH3[S.quiz],i,j;
  S.board=[];for(i=0;i<16;i++)S.board.push(null);
  for(i=0;i<3;i++)for(j=0;j<4;j++)S.board[i*4+j]=q.rows[i][j];
  S.rowTags=true;S.hiLine=[];S.say="";S.sayType="";
}
function newGame(){
  var i;
  S.board=[];for(i=0;i<16;i++)S.board.push(null);
  S.hand=null;S.turn=0;S.phase="pick";S.over=false;S.lock=false;
  S.hiCell=[];S.hiLine=[];S.badP=[];S.okP=[];S.selP=null;S.pendingWin=false;
  S.say="먼저 상대에게 줄 말을 하나 골라 주세요.";S.sayType="";
  updateHints();
}

/* ---------- 도움말 ---------- */
function updateHints(){
  S.hiCell=[];S.badP=[];
  if(!S.hints||S.over)return;
  if(S.ch!==5&&S.ch!==7)return;
  if(S.phase==="place"&&(!S.vsAI||S.turn===0)&&S.hand!=null){
    S.hiCell=winCells(S.board,S.hand,S.sq);
  }
  if(S.phase==="pick"&&(!S.vsAI||S.turn===0)){
    var pool=restPieces(S.board),i;
    for(i=0;i<pool.length;i++)if(winCells(S.board,pool[i],S.sq).length)S.badP.push(pool[i]);
  }
}

/* ---------- 게임 진행 (챕터 5·7) ---------- */
function finish(winner){
  S.over=true;S.lock=false;
  var wl=winLines(S.board,S.sq),i,j,cells=[];
  for(i=0;i<wl.length;i++)for(j=0;j<4;j++)cells.push(wl[i][j]);
  S.hiLine=cells;S.hiCell=[];S.badP=[];
  if(winner===2){S.say="무승부! 말판이 꽉 찼어요.";S.sayType="";}
  else if(winner===0){S.say="콰르토! "+(S.vsAI?"내가":"1번 친구가")+" 이겼어요!";S.sayType="good";toast("콰르토! 승리!");}
  else{S.say=(S.vsAI?"컴퓨터":"2번 친구")+"가 콰르토를 완성했어요.";S.sayType="bad";toast("아쉬워요!");}
  S.missionDone=true;S.done[S.ch]=true;save();renderAll();
}
function place(cell){
  S.board[cell]=S.hand;S.hand=null;
  var el=document.querySelector('.cell[data-i="'+cell+'"]');
  if(el)el.classList.add("drop");
  var w=winLines(S.board,S.sq);
  if(w.length&&!S.declare){finish(S.turn);return true;}
  if(w.length&&S.declare){
    S.pendingWin=true;
    if(S.vsAI&&S.turn===1){
      var seen=(S.lv===0)?(Math.random()<0.5):true;
      if(seen){finish(1);return true;}
      S.say="컴퓨터가 완성된 줄을 못 봤어요! 지금 콰르토를 외치면 내가 이겨요.";S.sayType="good";
    }else{
      S.say="줄이 완성됐을까요? 자신 있으면 콰르토를 외쳐요!";S.sayType="";
    }
  }
  if(emptyCells(S.board).length===0){finish(2);return true;}
  S.phase="pick";
  return false;
}
function aiTurn(){
  if(S.over||!S.vsAI)return;
  S.lock=true;renderAll();
  setTimeout(function(){
    if(S.over){S.lock=false;return;}
    if(S.phase==="place"&&S.turn===1){
      var c=aiPlace(S.board,S.hand,S.lv,S.sq);
      var ended=place(c);
      S.lock=false;
      if(ended)return;
      S.turn=1;S.phase="pick";
      updateHints();renderAll();
      aiTurn();
      return;
    }
    if(S.phase==="pick"&&S.turn===1){
      var g=aiGive(S.board,S.lv,S.sq);
      if(g==null){finish(2);return;}
      S.hand=g;S.turn=0;S.phase="place";S.lock=false;S.pendingWin=false;
      S.say="컴퓨터가 말을 줬어요. 빈 칸에 놓아 주세요.";S.sayType="";
      updateHints();renderAll();
    }
  },620);
}
function humanPick(p){
  S.hand=p;S.selP=null;S.pendingWin=false;
  if(S.vsAI){
    S.turn=1;S.phase="place";
    S.say="상대에게 말을 줬어요.";S.sayType="";
    updateHints();renderAll();aiTurn();
  }else{
    S.turn=1-S.turn;S.phase="place";
    S.say=(S.turn===0?"1번":"2번")+" 친구, 받은 말을 놓아 주세요.";S.sayType="";
    updateHints();renderAll();
  }
}

/* ---------- 클릭 처리 ---------- */
function onCell(i){
  if(S.ch===1){
    var p=S.board[i];
    if(p==null)return;
    S.say="<b>"+pieceName(p)+"</b> 말이에요.";S.sayType="";
    S.hi=[p];renderAll();return;
  }
  if(S.ch===2){
    if(S.board[i]!=null)return;
    if(i===D_CH2.answer){
      S.board[i]=D_CH2.piece;S.hand=null;
      S.hiLine=[4,5,6,7];
      S.say="정답! 밝은 나무 4개가 한 줄로 모였어요. 이게 <b>콰르토</b>예요!";S.sayType="good";
      S.missionDone=true;S.done[2]=true;save();toast("콰르토! 성공!");renderAll();
    }else{
      shakeBoard();
      S.say="그 칸은 아니에요. 세 개가 나란히 있는 <b>두 번째 가로줄</b>을 보세요!";S.sayType="bad";
      renderPanel();
    }
    return;
  }
  if(S.ch===6){
    if(S.board[i]!=null)return;
    S.board[i]=D_CH6.piece;
    var w=winLines(S.board,false);
    if(w.length){
      var cells=[],j,ln=w[0];
      for(j=0;j<4;j++)cells.push(ln[j]);
      S.hiLine=cells;S.hand=null;
      S.say="정답! "+bitLabel(commonBits(S.board[ln[0]],S.board[ln[1]],S.board[ln[2]],S.board[ln[3]]),S.board[ln[0]])
        +" 4개가 한 줄이 되었어요!";
      S.sayType="good";S.missionDone=true;S.done[6]=true;save();toast("퍼즐 성공!");renderAll();
    }else{
      S.board[i]=null;shakeBoard();
      S.say="아직 콰르토가 아니에요. 다른 칸도 살펴보세요!";S.sayType="bad";renderPanel();
    }
    return;
  }
  if(S.ch===5||S.ch===7){
    if(S.board[i]!=null||S.hand==null||S.phase!=="place")return;
    if(S.vsAI&&S.turn!==0)return;
    var me=S.turn;
    var ended=place(i);
    if(ended)return;
    S.turn=me;
    if(!S.declare){S.say="이제 상대에게 줄 말을 골라 주세요.";S.sayType="";}
    updateHints();renderAll();
  }
}
function onPieceClick(p){
  if(S.ch===4){
    if(D_CH4.cand.indexOf(p)<0)return;
    if(D_CH4.safe.indexOf(p)>=0){
      S.okP=[p];S.badP=[];
      S.say="좋아요! 이 말은 어디에 놓아도 상대가 못 이겨요. <b>안전한 말</b>이에요.";S.sayType="good";
      S.missionDone=true;S.done[4]=true;save();toast("안전한 말이에요!");renderAll();
    }else{
      S.lock=true;S.badP=[p];
      S.board[D_CH4.trap]=p;S.hiLine=[2,6,10,14];
      S.say="앗! 상대가 이 말을 저 칸에 놓으면 <b>큰 말 4개</b>가 세로로 완성돼요. 상대 승리!";
      S.sayType="bad";renderAll();
      setTimeout(function(){
        S.board[D_CH4.trap]=null;S.hiLine=[];S.badP=[p];S.lock=false;
        S.say="이렇게 <b>주면 안 되는 말</b>이 있어요. 다른 말을 골라 보세요!";S.sayType="";
        renderAll();
      },2400);
    }
    return;
  }
  if(S.ch===5||S.ch===7){
    if(S.phase!=="pick")return;
    if(S.vsAI&&S.turn!==0)return;
    if(S.board.indexOf(p)>=0)return;
    humanPick(p);
  }
}
function shakeBoard(){
  var b=$("#board");b.classList.remove("shake");
  void b.offsetWidth;b.classList.add("shake");
  setTimeout(function(){b.classList.remove("shake");},400);
}
function onAttr(i){
  S.selA=i;S.seen[i]=1;
  var bit=ATTR[i].bit,p,g0=[];
  for(p=0;p<16;p++)if(!(p&bit))g0.push(p);
  S.hi=g0;
  S.say=ATTR[i].name+" 특징이에요. 지금은 <b>"+ATTR[i].v0+"</b> 말 8개만 밝게 보여요. 흐린 쪽은 <b>"+ATTR[i].v1+"</b> 말이에요.";
  S.sayType="";
  if(S.seen[0]&&S.seen[1]&&S.seen[2]&&S.seen[3]&&!S.missionDone){
    S.missionDone=true;S.done[1]=true;save();toast("4가지 특징을 모두 배웠어요!");
  }
  renderAll();
}
function onQuiz(i){
  var q=D_CH3[S.quiz];
  if(!q)return;
  if(i===q.ans){
    var row=q.rows[i],bits=commonBits(row[0],row[1],row[2],row[3]);
    S.hiLine=[i*4,i*4+1,i*4+2,i*4+3];
    S.say="정답! "+(i+1)+"번째 줄은 모두 <b>"+bitLabel(bits,row[0])+"</b>이에요.";S.sayType="good";
    S.lock=true;renderAll();
    setTimeout(function(){
      S.quiz++;S.lock=false;
      if(S.quiz>=3){
        S.quiz=3;S.missionDone=true;S.done[3]=true;save();
        S.say="3문제 모두 정답! 이제 줄을 보는 눈이 생겼어요.";S.sayType="good";
        S.hiLine=[];toast("줄 찾기 통과!");renderAll();
      }else{loadQuiz();renderAll();}
    },1500);
  }else{
    shakeBoard();
    S.say=(i+1)+"번째 줄은 아니에요. 네 말이 <b>모두 똑같은 특징</b>을 하나라도 가져야 해요.";
    S.sayType="bad";renderPanel();
  }
}
function onAct(a){
  if(a==="next"){
    if(S.ch<7)enter(S.ch+1);
  }else if(a==="again"){
    enter(S.ch);
  }else if(a==="restart"){
    S.done={};save();enter(1);
  }else if(a==="peek"){
    S.hiCell=[D_CH6.answer];S.say="반짝이는 칸을 잘 보세요!";S.sayType="";renderAll();
  }else if(a==="newgame"){
    newGame();renderAll();
  }else if(a==="quarto"){
    if(winLines(S.board,S.sq).length){
      finish(S.pendingWin&&S.vsAI&&S.turn===1?0:S.turn);
    }else{
      S.say="아직 완성된 줄이 없어요. 잘 살펴보고 다시 외쳐요!";S.sayType="bad";renderPanel();
    }
  }
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button");
  if(!t)return;
  if(t.dataset.ch){enter(parseInt(t.dataset.ch,10));return;}
  if(t.id==="btnHint"){
    S.hints=!S.hints;$("#btnHint").classList.toggle("on",S.hints);
    updateHints();renderAll();toast(S.hints?"도움말 켜기":"도움말 끄기");return;
  }
  if(t.id==="btnReset"){S.done={};save();enter(1);toast("처음부터 시작!");return;}
  if(t.classList.contains("cell")){if(!S.lock)onCell(parseInt(t.dataset.i,10));return;}
  if(t.classList.contains("slot")){if(!S.lock)onPieceClick(parseInt(t.dataset.p,10));return;}
  if(t.dataset.attr!==undefined){onAttr(parseInt(t.dataset.attr,10));return;}
  if(t.dataset.q!==undefined){if(!S.lock)onQuiz(parseInt(t.dataset.q,10));return;}
  if(t.dataset.act){onAct(t.dataset.act);return;}
  if(t.dataset.lv!==undefined){S.lv=parseInt(t.dataset.lv,10);renderPanel();toast("컴퓨터 실력 변경");return;}
  if(t.dataset.vs!==undefined){S.vsAI=t.dataset.vs==="1";newGame();renderAll();return;}
  if(t.dataset.sq!==undefined){S.sq=t.dataset.sq==="1";newGame();renderAll();toast(S.sq?"2×2 규칙 켜기":"2×2 규칙 끄기");return;}
  if(t.dataset.dc!==undefined){S.declare=t.dataset.dc==="1";newGame();renderAll();return;}
});
window.addEventListener("resize",layout);
if(window.ResizeObserver){new ResizeObserver(layout).observe($("#boardWrap"));}

load();
$("#btnHint").classList.toggle("on",S.hints);
enter(S.ch||1);
setTimeout(layout,60);
</script>
